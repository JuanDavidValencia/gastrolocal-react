<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sabor&Sal - Reservas</title>
    <link rel="stylesheet" href="css/styles.css">
            <!-- SDK de Supabase (Auth + Data API) -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/auth-ui.js" type="module" defer></script>
    <script src="js/reservas.js" type="module" defer></script>
</head>
<body>
    <header class="header-principal">
        <div><h1><a href="index.html">GastroLocal</a></h1></div>
        <nav>
            <a href="index.html">Inicio</a>
                <a href="populares.html">Populares</a>
                <a href="Favoritos.html">Favoritos</a>
                <a href="recientes.html">Recientes</a>
                <a href="reservas.html">Reservas</a>
                <a href="vistaRestaurante.html">Vista</a>
        </nav>
            <div class="sesion-usuario">
                <a href="perfil.html" id="enlace-perfil" hidden title="Ir a mi perfil">
                    <img id="foto-perfil" alt="Foto de perfil" width="40" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%3E%3Ccircle%20cx='20'%20cy='16'%20r='7'%20fill='%23E67E22'/%3E%3Cpath%20d='M7%2038a13%2013%200%200%201%2026%200z'%20fill='%23E67E22'/%3E%3C/svg%3E">
                </a>
                <span id="nombre-usuario"></span>
                <button id="btn-acceder" type="button" title="Acceder con Google">Acceder</button>
                <button id="btn-registrarse" type="button" title="Registrarse con Google">Registrarse</button>
                <button id="btn-cerrar-sesion" type="button" hidden>Cerrar sesión</button>
            </div>
        </header>

    <main>
        <section class="seccion-reservas">
            <div class="encabezado-reservas">
                <h2>Haz tus reservas</h2>
                <p>En esta sección podrás realizar tus reservas en los restaurantes que más te gusten. Completa el formulario a continuación.</p>
            </div>

            <!-- Aviso para quien todavía no inició sesión -->
            <p id="reservas-aviso-sesion" class="aviso-sesion">
                Para reservar necesitas iniciar sesión con Google.
                <a href="index.html">Ir a iniciar sesión</a>
            </p>

            <p id="estado-reservas" role="status"></p>

            <form class="form-reservas" hidden>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="personas">Número de personas:</label>
                <input type="number" id="personas" name="personas" min="1" required>

                <label for="restaurante">Restaurante:</label>
                <select id="restaurante" name="restaurante" required>
                    <!-- Las opciones se cargan desde la API de Supabase -->
                </select>

                <label for="fecha">Fecha de reserva:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora de reserva:</label>
                <input type="time" id="hora" name="hora" required>

                <button type="submit">Realizar Reserva</button>
            </form>

            <!-- Las reservas que ya tiene registradas la persona -->
            <section class="seccion-mis-reservas">
                <h3>Mis reservas</h3>
                <div class="tarjetas" id="mis-reservas"></div>
            </section>
        </section>
    </main>
</body>
</html>
