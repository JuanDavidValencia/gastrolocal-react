        <script src="js/restaurantes.js" type="module" defer></script>
    </head>
    <body>
        <header>
            <div><h1><a href="index.html">GastroLocal</a></h1></div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="populares.html">Populares</a>
                <a href="Favoritos.html">Favoritos</a>
                <a href="recientes.html">Recientes</a>
                <a href="reservas.html">Reservas</a>
                <a href="vistaRestaurante.html">Vista</a>
            </nav>
            <div class="sesion-usuario">
                <a href="perfil.html" id="enlace-perfil" hidden title="Ir a mi perfil">
                    <img id="foto-perfil" alt="Foto de perfil" width="40" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%3E%3Ccircle%20cx='20'%20cy='16'%20r='7'%20fill='%23E67E22'/%3E%3Cpath%20d='M7%2038a13%2013%200%200%201%2026%200z'%20fill='%23E67E22'/%3E%3C/svg%3E">
                </a>
                <span id="nombre-usuario"></span>
                <button id="btn-acceder" type="button" title="Acceder con Google">Acceder</button>
                <button id="btn-registrarse" type="button" title="Registrarse con Google">Registrarse</button>
                <button id="btn-cerrar-sesion" type="button" hidden>Cerrar sesión</button>
            </div>
        </header>
        <main>
            
            <section id="restaurantes">
                <h2>Catalogo Restaurantes</h2>
            </section>

            <!--Filtros-->

            <div class="seleccion-filtro">

                <label for="restaurante">Filtrar por:</label>
                <select name="restaurante" id="restaurante" required>
                    <option value="">Selecciona Categoria...</option>
                    <option value="Comida Típica Colombiana">Comida Típica Colombiana</option>
                    <option value="Comida Rápida y Hamburguesas">Comida Rápida y Hamburguesas</option>
                    <option value="Comida Vegetariana y Vegana">Comida Vegetariana y Vegana</option>
                    <option value="Comida Mexicana">Comida Mexicana</option>
                    <option value="Comida Española">Comida Española</option>
                    <option value="Comida Italiana">Comida Italiana</option>
                    <option value="Comida Oriental y Asiática">Comida Oriental y Asiática</option>
                </select>

                <button id="boton-filtrar">Filtrar</button>

            </div>

            <!--Restaurantes-->

            <p id="estado" role="status"></p>

            <div class="tarjetas">
		
	        </div>
        
        </main>
